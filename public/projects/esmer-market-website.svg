<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Background -->
  <rect width="1200" height="500" fill="#f3efe7"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="1176" height="476" fill="none" stroke="#e9e4da" stroke-width="1"/>

  <!-- Left: Text block -->
  <!-- Accent dot near eyebrow -->
  <circle cx="72" cy="140" r="5" fill="#2563eb"/>

  <!-- Eyebrow -->
  <text x="88" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a8a195" letter-spacing="0.15em" text-anchor="start">WEB · CASE STUDY</text>

  <!-- Title -->
  <text x="72" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#1c1a17" font-weight="normal" text-anchor="start">Esmer Market</text>

  <!-- Thin rule under title -->
  <line x1="72" y1="262" x2="470" y2="262" stroke="#e9e4da" stroke-width="1"/>

  <!-- Tag pills -->
  <!-- nextjs -->
  <rect x="72" y="292" width="72" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="108" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">nextjs</text>

  <!-- firebase -->
  <rect x="154" y="292" width="84" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="196" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">firebase</text>

  <!-- i18n -->
  <rect x="248" y="292" width="56" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="276" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">i18n</text>

  <!-- Vertical divider -->
  <line x1="600" y1="60" x2="600" y2="440" stroke="#e9e4da" stroke-width="1"/>

  <!-- Right: storefront/browser motif -->
  <!-- Card shadow layer -->
  <rect x="680" y="98" width="448" height="316" rx="10" ry="10" fill="#e9e4da"/>
  <!-- Main browser window -->
  <rect x="676" y="94" width="448" height="316" rx="10" ry="10" fill="#ffffff" stroke="#ddd6c9" stroke-width="1.5"/>

  <!-- Browser chrome top bar -->
  <rect x="676" y="94" width="448" height="40" rx="10" ry="10" fill="#f3efe7"/>
  <rect x="676" y="114" width="448" height="20" fill="#f3efe7"/>
  <!-- Chrome dots -->
  <circle cx="704" cy="114" r="5" fill="#ddd6c9"/>
  <circle cx="723" cy="114" r="5" fill="#ddd6c9"/>
  <circle cx="742" cy="114" r="5" fill="#ddd6c9"/>
  <!-- URL bar -->
  <rect x="768" y="102" width="264" height="24" rx="4" ry="4" fill="#ffffff" stroke="#e9e4da" stroke-width="1"/>
  <text x="782" y="118" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a8a195">esmermarket.com</text>

  <!-- Language toggle TR | EN (TR active pill) -->
  <rect x="1048" y="102" width="60" height="24" rx="12" ry="12" fill="#ffffff" stroke="#e9e4da" stroke-width="1"/>
  <rect x="1050" y="104" width="28" height="20" rx="10" ry="10" fill="#2563eb" fill-opacity="0.12"/>
  <text x="1064" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">TR</text>
  <text x="1093" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a8a195" text-anchor="middle">EN</text>

  <!-- Divider under chrome -->
  <line x1="676" y1="134" x2="1124" y2="134" stroke="#e9e4da" stroke-width="1"/>

  <!-- Hero band -->
  <rect x="700" y="152" width="400" height="72" rx="6" ry="6" fill="#f9f7f4"/>
  <text x="720" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1c1a17">Esmer Market</text>
  <rect x="720" y="196" width="180" height="8" rx="2" fill="#e9e4da"/>
  <!-- Campaign badge in hero -->
  <rect x="1012" y="168" width="72" height="22" rx="11" ry="11" fill="#16a34a" fill-opacity="0.12"/>
  <text x="1048" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">Kampanya</text>

  <!-- Review card -->
  <rect x="700" y="240" width="400" height="128" rx="6" ry="6" fill="#f9f7f4"/>
  <!-- Reviewer avatar -->
  <circle cx="726" cy="270" r="14" fill="#e9e4da"/>
  <!-- Reviewer name line -->
  <rect x="750" y="258" width="120" height="9" rx="2" fill="#ddd6c9"/>
  <!-- 5 stars -->
  <g fill="#d97706">
    <path d="M750 282 l3.5 7.1 7.8 1.1 -5.6 5.5 1.3 7.8 -7 -3.7 -7 3.7 1.3 -7.8 -5.6 -5.5 7.8 -1.1 z"/>
    <path d="M786 282 l3.5 7.1 7.8 1.1 -5.6 5.5 1.3 7.8 -7 -3.7 -7 3.7 1.3 -7.8 -5.6 -5.5 7.8 -1.1 z"/>
    <path d="M822 282 l3.5 7.1 7.8 1.1 -5.6 5.5 1.3 7.8 -7 -3.7 -7 3.7 1.3 -7.8 -5.6 -5.5 7.8 -1.1 z"/>
    <path d="M858 282 l3.5 7.1 7.8 1.1 -5.6 5.5 1.3 7.8 -7 -3.7 -7 3.7 1.3 -7.8 -5.6 -5.5 7.8 -1.1 z"/>
    <path d="M894 282 l3.5 7.1 7.8 1.1 -5.6 5.5 1.3 7.8 -7 -3.7 -7 3.7 1.3 -7.8 -5.6 -5.5 7.8 -1.1 z"/>
  </g>
  <!-- Review text lines -->
  <rect x="720" y="322" width="360" height="8" rx="2" fill="#e9e4da"/>
  <rect x="720" y="338" width="300" height="8" rx="2" fill="#e9e4da"/>
  <rect x="720" y="354" width="220" height="8" rx="2" fill="#e9e4da"/>

  <!-- Decorative subtle line bottom left -->
  <line x1="72" y1="420" x2="420" y2="420" stroke="#e9e4da" stroke-width="1"/>
</svg>
