<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Background -->
  <rect width="1200" height="500" fill="#f3efe7"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="1176" height="476" fill="none" stroke="#e9e4da" stroke-width="1"/>

  <!-- Left text block -->
  <!-- Accent dot -->
  <circle cx="72" cy="150" r="4" fill="#2563eb"/>

  <!-- Eyebrow -->
  <text x="72" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a8a195" letter-spacing="0.15em" text-anchor="start">DESKTOP · CASE STUDY</text>

  <!-- Title -->
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1c1a17" text-anchor="start" font-weight="normal">Esmer Market</text>
  <text x="72" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1c1a17" text-anchor="start" font-weight="normal">Accounting</text>

  <!-- Thin rule under title -->
  <line x1="72" y1="340" x2="300" y2="340" stroke="#ddd6c9" stroke-width="1"/>

  <!-- Tag pills -->
  <!-- react -->
  <rect x="72" y="360" width="64" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="104" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">react</text>

  <!-- electron -->
  <rect x="146" y="360" width="86" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="189" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">electron</text>

  <!-- sql-server -->
  <rect x="242" y="360" width="110" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="297" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">sql-server</text>

  <!-- Vertical divider -->
  <line x1="600" y1="60" x2="600" y2="440" stroke="#e9e4da" stroke-width="1"/>

  <!-- Right side: desktop accounting app window -->
  <!-- Card shadow layer -->
  <rect x="680" y="88" width="448" height="324" rx="10" ry="10" fill="#e9e4da"/>
  <!-- Main app card -->
  <rect x="676" y="84" width="448" height="324" rx="10" ry="10" fill="#ffffff" stroke="#e9e4da" stroke-width="1"/>

  <!-- App top bar -->
  <rect x="676" y="84" width="448" height="40" rx="10" ry="10" fill="#f3efe7"/>
  <rect x="676" y="104" width="448" height="20" fill="#f3efe7"/>
  <!-- Window dots -->
  <circle cx="704" cy="104" r="5" fill="#ddd6c9"/>
  <circle cx="722" cy="104" r="5" fill="#ddd6c9"/>
  <circle cx="740" cy="104" r="5" fill="#ddd6c9"/>
  <!-- Top bar label -->
  <text x="1108" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a8a195" text-anchor="end" letter-spacing="0.08em">ESMER MARKET · MUHASEBE</text>

  <!-- Divider under top bar -->
  <line x1="676" y1="124" x2="1124" y2="124" stroke="#e9e4da" stroke-width="1"/>

