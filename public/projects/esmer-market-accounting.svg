  <text x="706" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" letter-spacing="0.05em">AÇIKLAMA</text>
  <text x="958" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="end" letter-spacing="0.05em">TUTAR</text>
  <line x1="706" y1="186" x2="958" y2="186" stroke="#e9e4da" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="706" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">STOK · #1024</text>
  <text x="958" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1c1a17" text-anchor="end">₺ 1.240</text>
  <line x1="706" y1="214" x2="958" y2="214" stroke="#e9e4da" stroke-width="0.5" opacity="0.6"/>
  <!-- Row 2 -->
  <text x="706" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">STOK · #1025</text>
  <text x="958" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1c1a17" text-anchor="end">₺ 860</text>
  <line x1="706" y1="242" x2="958" y2="242" stroke="#e9e4da" stroke-width="0.5" opacity="0.6"/>
  <!-- Row 3 -->
  <text x="706" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">CARİ · Toptan</text>
  <text x="958" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb" text-anchor="end">$ 420</text>
  <line x1="706" y1="270" x2="958" y2="270" stroke="#e9e4da" stroke-width="0.5" opacity="0.6"/>
  <!-- Row 4 -->
  <text x="706" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">KDV %20</text>
  <text x="958" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d97706" text-anchor="end">€ 96</text>

  <!-- Left: revenue bar chart panel -->
  <rect x="692" y="302" width="280" height="90" rx="6" ry="6" fill="#f9f7f4"/>
  <text x="706" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a8a195" letter-spacing="0.08em">CİRO</text>
  <!-- Baseline -->
  <line x1="706" y1="384" x2="958" y2="384" stroke="#e9e4da" stroke-width="1"/>
  <!-- Bars -->
  <rect x="712" y="354" width="22" height="30" rx="2" fill="#2563eb" fill-opacity="0.35"/>
  <rect x="750" y="340" width="22" height="44" rx="2" fill="#2563eb" fill-opacity="0.45"/>
  <rect x="788" y="358" width="22" height="26" rx="2" fill="#2563eb" fill-opacity="0.35"/>
  <rect x="826" y="330" width="22" height="54" rx="2" fill="#2563eb" fill-opacity="0.55"/>
  <rect x="864" y="344" width="22" height="40" rx="2" fill="#2563eb" fill-opacity="0.45"/>
  <rect x="902" y="322" width="22" height="62" rx="2" fill="#16a34a" fill-opacity="0.85"/>

  <!-- Divider between left panels and right column -->
  <line x1="976" y1="140" x2="976" y2="392" stroke="#e9e4da" stroke-width="1"/>

  <!-- Right column: currency + KPI -->
  <rect x="982" y="140" width="126" height="252" rx="6" ry="6" fill="#f9f7f4"/>

  <!-- Multi-currency badge -->
  <rect x="994" y="158" width="102" height="38" rx="8" ry="8" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="1045" y="183" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1c1a17" text-anchor="middle">₺ / $ / €</text>
  <text x="1045" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.08em">ÇOK DÖVİZLİ</text>

  <!-- KPI gauge: profit -->
  <circle cx="1045" cy="278" r="36" fill="none" stroke="#e9e4da" stroke-width="7" stroke-dasharray="169 226" stroke-dashoffset="-28" stroke-linecap="round"/>
  <circle cx="1045" cy="278" r="36" fill="none" stroke="#16a34a" stroke-width="7" stroke-dasharray="140 226" stroke-dashoffset="-28" stroke-linecap="round" opacity="0.85"/>
  <text x="1045" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1c1a17" text-anchor="middle">+18%</text>
  <text x="1045" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a8a195" text-anchor="middle" letter-spacing="0.06em">KÂR</text>

  <!-- Status rows -->
  <circle cx="998" cy="350" r="4" fill="#16a34a"/>
  <text x="1008" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">CARİ · 214</text>
  <circle cx="998" cy="372" r="4" fill="#2563eb"/>
  <text x="1008" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">STOK · 1.284</text>

  <!-- Decorative line bottom left -->
  <line x1="72" y1="420" x2="420" y2="420" stroke="#e9e4da" stroke-width="1"/>
</svg>
