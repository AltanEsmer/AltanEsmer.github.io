<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Background -->
  <rect width="1200" height="500" fill="#f3efe7"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="1176" height="476" fill="none" stroke="#e9e4da" stroke-width="1"/>

  <!-- Left text block -->
  <!-- Accent dot -->
  <circle cx="72" cy="150" r="4" fill="#2563eb"/>

  <!-- Eyebrow -->
  <text x="72" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a8a195" letter-spacing="0.15em" text-anchor="start">WEB · CASE STUDY</text>

  <!-- Title -->
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1c1a17" text-anchor="start" font-weight="normal">Event Management</text>
  <text x="72" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1c1a17" text-anchor="start" font-weight="normal">System</text>

  <!-- Thin rule under title -->
  <line x1="72" y1="340" x2="300" y2="340" stroke="#ddd6c9" stroke-width="1"/>

  <!-- Tag pills -->
  <!-- react -->
  <rect x="72" y="360" width="64" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="104" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">react</text>

  <!-- node -->
  <rect x="146" y="360" width="60" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="176" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">node</text>

  <!-- postgres -->
  <rect x="216" y="360" width="92" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="262" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">postgres</text>

  <!-- Vertical divider -->
  <line x1="600" y1="60" x2="600" y2="440" stroke="#e9e4da" stroke-width="1"/>

  <!-- Right side: calendar card motif -->
  <!-- Card shadow layer -->
  <rect x="660" y="100" width="452" height="308" rx="10" ry="10" fill="#e9e4da"/>
  <!-- Main card -->
  <rect x="656" y="96" width="452" height="308" rx="10" ry="10" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="656" y="96" width="452" height="40" rx="10" ry="10" fill="#f3efe7"/>
  <rect x="656" y="116" width="452" height="20" fill="#f3efe7"/>
  <!-- Top bar dots -->
  <circle cx="684" cy="116" r="5" fill="#ddd6c9"/>
  <circle cx="703" cy="116" r="5" fill="#ddd6c9"/>
  <circle cx="722" cy="116" r="5" fill="#ddd6c9"/>
  <!-- Top bar label -->
  <text x="1092" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a8a195" text-anchor="end" letter-spacing="0.08em">EVENT CALENDAR</text>
  <!-- Divider under top bar -->
  <line x1="656" y1="136" x2="1108" y2="136" stroke="#e9e4da" stroke-width="1"/>

  <!-- Month label -->
  <text x="672" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1c1a17" font-weight="normal">June 2026</text>

  <!-- Weekday header -->
  <text x="702" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">S</text>
  <text x="762" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">M</text>
  <text x="822" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">T</text>
  <text x="882" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">W</text>
  <text x="942" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">T</text>
  <text x="1002" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">F</text>
  <text x="1062" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195" text-anchor="middle" letter-spacing="0.05em">S</text>

  <!-- Month grid background -->
  <rect x="672" y="184" width="420" height="160" fill="#f9f7f4"/>
  <!-- Grid vertical lines -->
  <line x1="732" y1="184" x2="732" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <line x1="792" y1="184" x2="792" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <line x1="852" y1="184" x2="852" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <line x1="912" y1="184" x2="912" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <line x1="972" y1="184" x2="972" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <line x1="1032" y1="184" x2="1032" y2="344" stroke="#e9e4da" stroke-width="1"/>
  <!-- Grid horizontal lines -->
  <line x1="672" y1="224" x2="1092" y2="224" stroke="#e9e4da" stroke-width="1"/>
  <line x1="672" y1="264" x2="1092" y2="264" stroke="#e9e4da" stroke-width="1"/>
  <line x1="672" y1="304" x2="1092" y2="304" stroke="#e9e4da" stroke-width="1"/>
  <!-- Grid border -->
  <rect x="672" y="184" width="420" height="160" fill="none" stroke="#e9e4da" stroke-width="1"/>

  <!-- Day numbers (faint) -->
  <text x="678" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">1</text>
  <text x="738" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">2</text>
  <text x="798" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">3</text>
  <text x="858" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">4</text>
  <text x="918" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">5</text>
  <text x="978" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">6</text>
  <text x="1038" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">7</text>
  <text x="678" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">8</text>
  <text x="858" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a8a195">11</text>

  <!-- Event blocks (color-coded categories) -->
  <!-- Green: Party, day 3-4 -->
  <rect x="796" y="203" width="112" height="14" rx="3" fill="#16a34a" fill-opacity="0.14"/>
  <text x="802" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16a34a">Party</text>
  <!-- Blue: Wedding, day 8-10 -->
  <rect x="676" y="243" width="170" height="14" rx="3" fill="#2563eb" fill-opacity="0.14"/>
  <text x="682" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#2563eb">Wedding · Grand Hall</text>
  <!-- Amber: Conference, day 11-12 -->
  <rect x="856" y="283" width="110" height="14" rx="3" fill="#d97706" fill-opacity="0.14"/>
  <text x="862" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#d97706">Conference</text>

  <!-- Footer legend -->
  <circle cx="678" cy="368" r="4" fill="#2563eb"/>
  <text x="690" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">Weddings</text>
  <circle cx="760" cy="368" r="4" fill="#d97706"/>
  <text x="772" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">Conferences</text>
  <circle cx="878" cy="368" r="4" fill="#16a34a"/>
  <text x="890" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#57534e">Parties</text>
  <text x="1092" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a8a195" text-anchor="end" letter-spacing="0.05em">OCCUPANCY 78%</text>

  <!-- Decorative line bottom left -->
  <line x1="72" y1="420" x2="420" y2="420" stroke="#e9e4da" stroke-width="1"/>
</svg>
