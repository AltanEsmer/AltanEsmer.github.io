  <text x="694" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a8a195" letter-spacing="0.06em">MARKET A</text>
  <text x="694" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57534e">$142.00</text>

  <text x="830" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a8a195" letter-spacing="0.06em">MARKET B</text>
