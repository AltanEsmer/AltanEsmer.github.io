<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Background -->
  <rect width="1200" height="500" fill="#f3efe7"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="1176" height="476" fill="none" stroke="#e9e4da" stroke-width="1"/>

  <!-- Left text block -->
  <!-- Eyebrow -->
  <text x="72" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a8a195" letter-spacing="0.15em" text-anchor="start">TOOLS · CASE STUDY</text>

  <!-- Title -->
  <text x="72" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#1c1a17" text-anchor="start" font-weight="normal">Link Safety</text>
  <text x="72" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#1c1a17" text-anchor="start" font-weight="normal">Checker</text>

  <!-- Tag pills -->
  <!-- python -->
  <rect x="72" y="358" width="82" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="113" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">python</text>

  <!-- security -->
  <rect x="164" y="358" width="88" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="208" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">security</text>

  <!-- cli -->
  <rect x="262" y="358" width="56" height="30" rx="4" ry="4" fill="#ffffff" stroke="#ddd6c9" stroke-width="1"/>
  <text x="290" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57534e" text-anchor="middle">cli</text>

  <!-- Vertical divider -->
  <line x1="600" y1="60" x2="600" y2="440" stroke="#e9e4da" stroke-width="1"/>

  <!-- Right side motif -->

  <!-- Browser window card -->
  <rect x="648" y="130" width="468" height="240" rx="10" ry="10" fill="#ffffff" stroke="#ddd6c9" stroke-width="1.5"/>

  <!-- Browser chrome top bar -->
  <rect x="648" y="130" width="468" height="44" rx="10" ry="10" fill="#f3efe7"/>
  <rect x="648" y="152" width="468" height="22" fill="#f3efe7"/>
  <!-- Square off only bottom corners of top bar -->
  <rect x="648" y="152" width="468" height="22" fill="#f3efe7"/>

  <!-- Browser dots -->
  <circle cx="676" cy="152" r="5" fill="#ddd6c9"/>
  <circle cx="695" cy="152" r="5" fill="#ddd6c9"/>
  <circle cx="714" cy="152" r="5" fill="#ddd6c9"/>

  <!-- Browser bar divider -->
  <line x1="648" y1="174" x2="1116" y2="174" stroke="#e9e4da" stroke-width="1"/>

  <!-- URL address bar -->
  <rect x="736" y="137" width="352" height="28" rx="4" ry="4" fill="#ffffff" stroke="#e9e4da" stroke-width="1"/>
  <!-- Lock icon small -->
  <rect x="748" y="146" width="8" height="9" rx="1" ry="1" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M750 146 Q750 142 756 142 Q762 142 762 146" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <!-- URL text -->
  <text x="764" y="157" font-family="'Courier New', Courier, monospace" font-size="12" fill="#57534e">https://example.com/path?ref=123</text>

  <!-- Content area of browser -->
  <!-- Scan result lines -->
  <rect x="672" y="196" width="420" height="1" fill="#e9e4da"/>

  <!-- Result row 1 -->
  <rect x="672" y="210" width="300" height="10" rx="2" fill="#e9e4da"/>
  <rect x="992" y="208" width="52" height="14" rx="3" fill="#16a34a" fill-opacity="0.12"/>
  <text x="1018" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">SAFE</text>

  <!-- Result row 2 -->
  <rect x="672" y="234" width="240" height="10" rx="2" fill="#e9e4da"/>
  <rect x="992" y="232" width="52" height="14" rx="3" fill="#16a34a" fill-opacity="0.12"/>
  <text x="1018" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">SAFE</text>

  <!-- Result row 3 -->
  <rect x="672" y="258" width="270" height="10" rx="2" fill="#e9e4da"/>
  <rect x="992" y="256" width="52" height="14" rx="3" fill="#d97706" fill-opacity="0.12"/>
  <text x="1018" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">WARN</text>

  <!-- Result row 4 -->
  <rect x="672" y="282" width="320" height="10" rx="2" fill="#e9e4da"/>
  <rect x="992" y="280" width="52" height="14" rx="3" fill="#16a34a" fill-opacity="0.12"/>
  <text x="1018" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">SAFE</text>

  <!-- Bottom divider -->
  <rect x="672" y="312" width="420" height="1" fill="#e9e4da"/>

  <!-- Shield icon bottom right of card -->
  <!-- Shield shape -->
  <path d="M990 330 Q990 318 1004 315 Q1018 318 1018 330 Q1018 344 1004 350 Q990 344 990 330 Z" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <!-- Checkmark inside shield -->
  <path d="M998 330 L1002 335 L1011 324" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Status text -->
  <text x="1024" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57534e">All checks passed</text>
  <text x="1024" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a8a195">3 safe · 1 warning · 0 blocked</text>

  <!-- Decorative subtle lines bottom left -->
  <line x1="72" y1="420" x2="420" y2="420" stroke="#e9e4da" stroke-width="1"/>
</svg>
